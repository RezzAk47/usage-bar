# NOT YET EXECUTED: this workflow was written and syntax-checked on a Mac, but GitHub Actions has not run it.
# Expect to fix small things (a package name, a path) on its first run.
name: ci

# Third-party actions are pinned to full commit SHAs (version in the trailing comment).
# The Rust toolchain must be 1.90 or newer (the locked crates need it; src-tauri/Cargo.toml says rust-version = "1.90").
# dtolnay/rust-toolchain@stable installs the current stable, which satisfies that.

on:
  push:
  pull_request:

# one run per branch: a push and the pull request for the same branch do not both keep running
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux system packages (WebKitGTK, tray, build tools)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm packages
        run: npm ci --ignore-scripts # no package install scripts run; nothing here needs one (Playwright's browsers are installed by an explicit step below)

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Log-crate guard (no logger crate in Cargo.lock, log compiled out)
        run: npm run log-guard

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev

      - name: Build the page (needed by the Rust build)
        run: npm run build

      - name: Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build the app (debug, unsigned)
        run: npm run tauri build -- --debug --bundles ${{ matrix.bundles }} -- --locked

      - name: "token-leak (macOS only) - real run with fake credentials and a hostile fake server; no token in any form may appear anywhere"
        if: matrix.os == 'macos-latest'
        run: npm run token-leak

  screenshots:
    name: UI screenshots (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts # no package install scripts run; nothing here needs one (Playwright's browsers are installed by an explicit step below)
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: UI checks (keyboard, focus, RTL, small screens)
        run: npm run ui:smoke
      - name: Screenshots with made-up fixture data, light and dark
        run: npm run shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots
          path: shots/*.png
          if-no-files-found: error
